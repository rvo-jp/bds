[package]
name = "bdsctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Small Linux/systemd manager for one Minecraft Bedrock server"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.23"
ring = "0.17"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
ed25519-dalek = "2"
httparse = "=1.10.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
