name: Rust checks and Linux binary
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y rsync zstd musl-tools
      - run: cargo +1.96.1 fmt --check
      - run: cargo +1.96.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.96.1 test --locked
      - run: python3 -m unittest discover -s tests -p 'test_distribution.py' -v
      - run: rustup target add x86_64-unknown-linux-musl --toolchain 1.96.1
      - run: cargo +1.96.1 build --release --locked --target x86_64-unknown-linux-musl --bins --examples
        env:
          BDS_COMMIT: ${{ github.sha }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
      - run: sudo env BDS_ACCEPTANCE_REPORT="$RUNNER_TEMP/bds-validation.json" python3 tests/linux_acceptance.py target/x86_64-unknown-linux-musl/release/bdsctl target/x86_64-unknown-linux-musl/release/examples/fake_bds
      - name: Test official BDS in a private network
        run: |
          curl --fail --location --retry 2 --max-time 180 -A 'Mozilla/5.0 bdsctl' -o "$RUNNER_TEMP/bedrock.zip" https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-1.26.63.1.zip
          sudo python3 tests/real_bds_acceptance.py target/x86_64-unknown-linux-musl/release/bdsctl "$RUNNER_TEMP/bedrock.zip"
      - run: deploy/package.sh
        env:
          BDS_VALIDATION_REPORT: ${{ runner.temp }}/bds-validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bdsctl-linux-x86_64-${{ github.sha }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bdsctl-linux-x86_64-${{ github.sha }}
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
